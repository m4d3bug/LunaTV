name: cron

# 替代 vercel.json 中的 Vercel Cron（每天 01:00 北京时间触发 /api/cron）
on:
  schedule:
    # UTC 17:00 = 北京时间次日 01:00
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/cron
        run: curl -fsSL --max-time 120 "https://tv.madebug.net/api/cron"
